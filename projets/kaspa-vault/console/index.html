<style>
:root {
  --bg: #f6f6f3; --surface: #ffffff; --surface-2: #eeeeea; --border: #dedfdb;

  --ok: #1a7f47; --ok-soft: #dcf0e3; --warn: #8a5a00; --warn-soft: #f6ecd6; --bad: #b03a2e; --bad-soft: #f6e1de;
  --strong: #3a4048; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1e22; --surface: #23272c; --surface-2: #2a2f35; --border: #33383e;
    --text: #eceae6; --muted: #979ea6; --accent: #5cc493; --accent-soft: #16291f;
    --ok: #5cc493; --ok-soft: #16291f; --warn: #e5b45a; --warn-soft: #33291a; --bad: #ec8b7f; --bad-soft: #3a2220;
    --strong: #eceae6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1e22; --surface: #23272c; --surface-2: #2a2f35; --border: #33383e;
  --text: #eceae6; --muted: #979ea6; --accent: #5cc493; --accent-soft: #16291f;
  --ok: #5cc493; --ok-soft: #16291f; --warn: #e5b45a; --warn-soft: #33291a; --bad: #ec8b7f; --bad-soft: #3a2220;
  --strong: #eceae6; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 "IBM Plex Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.mono, code { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
a { color: var(--accent); }
button, select { font: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
h1, h2, h3 { letter-spacing: -.02em; }

header.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
header.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); margin-right: auto; }
.brand-mark { display: inline-grid; place-items: center; width: 30px; height: 30px; background: #3a4048; color: #fff; font: 600 12px "IBM Plex Mono", monospace; position: relative; }
.brand-mark::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: 4px; height: 2px; background: #1f9d61; }
.brand small { font: 500 13px "IBM Plex Mono", monospace; color: var(--muted); }
.brand b { font-weight: 600; }
select { border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 6px 8px; }
.lang-switch { display: inline-flex; border: 1px solid var(--accent); }
.lang-switch button { font: 500 12px "IBM Plex Mono", monospace; letter-spacing: .04em; padding: 5px 9px; border: 0; background: transparent; color: var(--accent); cursor: pointer; }
.lang-switch button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.theme-toggle { display: inline-grid; place-items: center; width: 30px; height: 28px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
.theme-toggle:hover, .lang-switch button:not([aria-pressed="true"]):hover { background: var(--accent-soft); }

.notice { display: flex; gap: 12px; align-items: flex-start; margin: 20px 0 0; padding: 12px 16px; border: 1px solid var(--border); border-left: 3px solid var(--accent); background: var(--surface); font-size: 14px; }
.notice b { font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 16px 0 12px; }
.card { background: var(--surface); border: 1px solid var(--border); }
.stat { padding: 14px 16px; }
.stat .l { font: 500 11.5px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.stat .num { font-size: 22px; font-weight: 600; margin-top: 4px; letter-spacing: -.02em; }
.stat .num small { font-size: 13px; color: var(--muted); font-weight: 400; }
.addr { display: flex; gap: 10px; align-items: center; padding: 10px 14px; flex-wrap: wrap; }
.addr .mono { font-size: 12.5px; word-break: break-all; flex: 1 1 300px; }
.tag { font: 500 11px "IBM Plex Mono", monospace; padding: 2px 8px; background: var(--accent-soft); color: var(--accent); }
.tag.grey { background: var(--surface-2); color: var(--muted); }
.btn { border: 1px solid var(--strong); background: transparent; color: var(--text); padding: 7px 12px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--strong); color: var(--bg); }
.btn.solid { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.solid { color: var(--bg); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; background: transparent; color: var(--text); }

.layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; margin: 18px 0 40px; align-items: start; }
.side { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 92px); overflow: auto; }
h2 { font-size: 17px; margin: 0 0 8px; font-weight: 600; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.path { padding: 14px 16px; margin-bottom: 10px; }
.path-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.path-head h3 { margin: 0; font: 600 15px "IBM Plex Mono", monospace; }
.who { font-size: 12px; color: var(--muted); }
.pill { margin-left: auto; font: 500 12px "IBM Plex Mono", monospace; padding: 2px 8px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.wait { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.path p { margin: 6px 0 10px; color: var(--muted); font-size: 13.5px; }
.bar { height: 6px; background: var(--surface-2); overflow: hidden; margin: 2px 0 10px; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .8s linear; }
.bar i.done { background: var(--ok); }
.path .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.locked { font-size: 12.5px; color: var(--muted); }

.panel { padding: 16px; }
.result { padding: 10px 12px; font-weight: 500; font-size: 14px; margin-bottom: 12px; }
.result.ok { background: var(--ok-soft); color: var(--ok); }
.result.bad { background: var(--bad-soft); color: var(--bad); }
.result.info { background: var(--surface-2); color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; margin: 0 0 10px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-all; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 10px; }
th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
th { font: 500 11px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
details { font-size: 12px; color: var(--muted); }
details pre { white-space: pre-wrap; word-break: break-all; background: var(--surface-2); padding: 8px; }

.steps { list-style: none; margin: 10px 0 0; padding: 0; max-height: 330px; overflow: auto; }
.steps li { display: grid; grid-template-columns: 20px 52px 1fr; gap: 8px; align-items: baseline; padding: 7px 4px; border-top: 1px solid var(--border); cursor: pointer; font-size: 13px; }
.steps li:hover { background: var(--surface-2); }
.steps li.cur { background: var(--accent-soft); }
.steps .when { font: 400 12px "IBM Plex Mono", monospace; color: var(--muted); }
.steps .mk.ok { color: var(--ok); } .steps .mk.bad { color: var(--bad); }
.player { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.attack { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
.attack:first-of-type { border-top: 0; }
.attack div { flex: 1; } .attack small { display: block; color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; }
footer { border-top: 1px solid var(--border); padding: 20px 0 36px; color: var(--muted); font-size: 13px; }
@media (max-width: 980px) { .layout { grid-template-columns: 1fr; } .side { position: static; max-height: none; } }
@media (max-width: 640px) { .stats { grid-template-columns: 1fr 1fr; } }
</style>

      "p.withdraw": "Retrait courant, plafonné ; le reste revient au coffre dans un nouvel UTXO.",
      "p.withdrawAll": "Retire tout l'UTXO, après un délai 3 fois plus long.",
      "p.recoverByInactivity": "La clé de secours récupère les fonds après une longue inactivité.",
      "p.recoverByDeadline": "Échéance absolue, qu'aucune activité ne peut repousser.",
      "who.owner": "clé owner", "who.recovery": "clé de secours", "who.deposit": "clé owner → coffre",
      always: "toujours possible", open: "déverrouillé", in: "dans", empty: "coffre vide",
      see: "Voir la vraie transaction", signOff: "Signature désactivée en ligne",
      nodata: "Aucun UTXO pour le moment.",
      start: "Choisissez une étape de la session, ou lancez le rejeu.",
      action: "Action", signedBy: "signée par", owner: "la clé owner", recovery: "la clé de secours",
      fee: "Frais", seqLbl: "sequence (délai relatif)", lock: "lock_time (échéance)", input: "Entrée", output: "Sortie", to: "Vers",
      vault: "coffre", ownerW: "owner", recoveryW: "secours", detail: "Détail technique", explorerLink: "explorateur ↗",
      indexer: "Les explorateurs peuvent afficher « introuvable » : l'indexeur public de Testnet-10 est bloqué depuis le 26/09.",
      "att.cap": "Retrait au-dessus du plafond", "att.early": "Retrait avant le délai", "att.wrongkey": "Secours signé avec la clé owner", "att.fee": "Frais excessifs (0,2 tKAS)", "att.sweep": "Tout retirer avant le délai",
      show: "Voir", api: "API Testnet-10 injoignable, nouvel essai…", updated: "à jour",
    },
    en: {
      "nav.back": "← Case study", title: "Vault console",
      notice: "<b>Online, read-only version.</b> The real console runs locally and signs with keys that never leave my machine. Here, balances and delays are read live from Testnet-10, and the real session of 27 Sep can be replayed step by step.",
      "s.bal": "Vault balance", "s.owner": "Owner wallet", "s.daa": "DAA score", "s.cap": "Cap / withdraw",
      addr: "Vault address", explorer: "Explorer ↗",
      "paths.title": "Spending paths", "utxo.title": "Vault UTXOs", "utxo.amount": "Amount", "utxo.age": "Age",
      "insp.title": "Transaction inspector", "replay.title": "Replay the 27 Sep session",
      "replay.hint": "Demo vault with short delays: all 4 paths accepted by the network and 5 attacks rejected, in 13 minutes.",
      "replay.play": "▶ Replay", "replay.pause": "❚❚ Pause",
      "att.title": "Protection tests", "att.hint": "Actual result of each attack during the session.",
      footer: "Martino Ismaël · SilverScript vault on Kaspa Testnet-10 · <a href=\"../index.html\">Case study</a>",
      "vault.main": "Main vault", "vault.demo": "Demo vault (27 Sep)",
      hint: (p) => `Delays: withdraw ≈ ${dur(p.cooldown / DAA_PER_SEC)}, withdrawAll ≈ ${dur(p.cooldown * 3 / DAA_PER_SEC)}, inactivity ≈ ${dur(p.inactivity / DAA_PER_SEC)}, deadline on ${new Date(p.deadline).toLocaleString("en-GB")}. States refer to the largest UTXO.`,
      "p.deposit": "Sends tKAS from the owner wallet to the vault. Each deposit is a UTXO with its own clock.",
      "p.withdraw": "Everyday capped withdrawal; the change returns to the vault as a new UTXO.",
      "p.withdrawAll": "Sweeps the whole UTXO, after a delay 3 times longer.",
      "p.recoverByInactivity": "The recovery key takes the funds after a long period of inactivity.",
      "p.recoverByDeadline": "Absolute deadline that no activity can push back.",
      "who.owner": "owner key", "who.recovery": "recovery key", "who.deposit": "owner key → vault",
      always: "always possible", open: "unlocked", in: "in", empty: "vault empty",
      see: "See the real transaction", signOff: "Signing disabled online",
      nodata: "No UTXO right now.",
      start: "Pick a step of the session, or start the replay.",
      action: "Action", signedBy: "signed by", owner: "the owner key", recovery: "the recovery key",
      fee: "Fee", seqLbl: "sequence (relative delay)", lock: "lock_time (deadline)", input: "Input", output: "Output", to: "To",
      vault: "vault", ownerW: "owner", recoveryW: "recovery", detail: "Technical detail", explorerLink: "explorer ↗",
      indexer: "Explorers may show \"not found\": the public Testnet-10 indexer has been stalled since 26 Sep.",
      "att.cap": "Withdrawal above the cap", "att.early": "Withdrawal before the delay", "att.wrongkey": "Recovery signed with the owner key", "att.fee": "Excessive fee (0.2 tKAS)", "att.sweep": "Sweep before the delay",
      show: "Show", api: "Testnet-10 API unreachable, retrying…", updated: "updated",
    },
  };

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* stockage indisponible */ } },
  };
  const urlLang = new URLSearchParams(location.search).get("lang");
  if (urlLang === "fr" || urlLang === "en") store.set("site.lang", urlLang);
  let lang = store.get("site.lang") === "en" ? "en" : "fr";
  const t = (k) => I18N[lang][k] ?? I18N.fr[k] ?? k;
  const L = (o) => (o ? o[lang] : "");
  const $ = (id) => document.getElementById(id);
  const esc = (x) => String(x).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const nf = () => new Intl.NumberFormat(lang === "fr" ? "fr-FR" : "en-US", { maximumFractionDigits: 8 });
  const kas = (s) => nf().format(s / SOMPI);
  const hhmm = (iso) => new Date(iso).toLocaleTimeString(lang === "fr" ? "fr-FR" : "en-GB");
  function dur(sec) {
    sec = Math.max(0, Math.round(sec));
    const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    const u = lang === "fr" ? ["j", "h", "min", "s"] : ["d", "h", "min", "s"];
    if (d) return `${nf().format(d)} ${u[0]} ${h} ${u[1]}`;
    if (h) return `${h} ${u[1]} ${m} ${u[2]}`;
    if (m) return `${m} ${u[2]} ${s} ${u[3]}`;
    return `${s} ${u[3]}`;
  }

  const PATHS = [
    { mode: "deposit", who: "who.deposit" },
    { mode: "withdraw", who: "who.owner", lock: "cooldown" },
    { mode: "withdrawAll", who: "who.owner", lock: "all" },
    { mode: "recoverByInactivity", who: "who.recovery", lock: "inactivity" },
    { mode: "recoverByDeadline", who: "who.recovery", lock: "deadline" },
  ];
  let vaultId = "main", st = null, fetchedAt = 0, stepIdx = -1, timer = null;

  function state(p) {
    if (!p.lock) return { cls: "ok", text: t("always"), pct: 100, open: true };
    const v = VAULTS[vaultId];
    if (p.lock === "deadline") {
      const rem = (v.deadline - Date.now()) / 1000;
      return rem <= 0 ? { cls: "ok", text: t("open"), pct: 100, open: true } : { cls: "wait", text: `${t("in")} ${dur(rem)}`, pct: 0, open: false };
    }
    const u = st && st.utxos[0];
    if (!u) return { cls: "bad", text: t("empty"), pct: 0, open: false };
    const req = p.lock === "cooldown" ? v.cooldown : p.lock === "all" ? v.cooldown * 3 : v.inactivity;
    const age = u.age + (Date.now() - fetchedAt) / 1000 * DAA_PER_SEC;
    return age >= req ? { cls: "ok", text: t("open"), pct: 100, open: true } : { cls: "wait", text: `${t("in")} ${dur((req - age) / DAA_PER_SEC)}`, pct: Math.min(100, age / req * 100), open: false };
  }

  function renderPaths() {
    $("paths").innerHTML = PATHS.map((p) => {
      const s = state(p), real = SESSION.findIndex((x) => x.action === p.mode && x.ok);
      return `<div class="card path" data-mode="${p.mode}">
        <div class="path-head"><h3>${p.mode === "deposit" ? (lang === "fr" ? "dépôt" : "deposit") : p.mode}</h3><span class="who">${t(p.who)}</span><span class="pill ${s.cls}" data-pill>${s.text}</span></div>
        <p>${t("p." + p.mode)}</p>
        ${p.lock && p.lock !== "deadline" ? `<div class="bar"><i data-bar class="${s.open ? "done" : ""}" style="width:${s.pct}%"></i></div>` : ""}
        <div class="row"><button class="btn small" type="button" data-step="${real}">${t("see")} →</button><span class="locked">🔒 ${t("signOff")}</span></div>
      </div>`;
    }).join("");
  }
  function tick() {
    document.querySelectorAll(".path").forEach((el) => {
      const s = state(PATHS.find((p) => p.mode === el.dataset.mode));
      const pill = el.querySelector("[data-pill]"); pill.className = `pill ${s.cls}`; pill.textContent = s.text;
      const bar = el.querySelector("[data-bar]"); if (bar) { bar.style.width = `${s.pct}%`; bar.className = s.open ? "done" : ""; }
    });
  }

  function renderStatus() {
    const v = VAULTS[vaultId];
    $("addr").textContent = v.address;
    $("explorer").href = `${EXPLORER}/addresses/${v.address}`;
    $("sCap").innerHTML = `${kas(v.cap)} <small>tKAS</small>`;
    $("pathsHint").textContent = I18N[lang].hint(v);
    if (!st) return;
    $("sBal").innerHTML = `${kas(st.balance)} <small>tKAS</small>`;
    $("sOwner").innerHTML = `${kas(st.owner)} <small>tKAS</small>`;
    $("sDaa").textContent = nf().format(st.daa);
    $("utxoRows").innerHTML = st.utxos.length ? st.utxos.map((u) => `<tr>
      <td class="mono"><a href="${EXPLORER}/transactions/${u.txid}" target="_blank" rel="noopener">${u.txid.slice(0, 8)}…:${u.index}</a></td>
      <td>${kas(u.amount)} tKAS</td><td>${nf().format(u.age)} DAA · ${dur(u.age / DAA_PER_SEC)}</td></tr>`).join("")
      : `<tr><td colspan="3" class="empty">${t("nodata")}</td></tr>`;
    tick();
  }

  function renderInspector(i) {
    const s = SESSION[i];
    if (!s) { $("inspector").innerHTML = `<div class="result info">${t("start")}</div>`; return; }
    if (s.action === "create") { $("inspector").innerHTML = `<div class="result info">${hhmm(s.at)} · ${esc(L(s.info))}</div>`; return; }
    const head = `<div class="result ${s.ok ? "ok" : "bad"}">${s.ok ? "✓" : "✗"} ${esc(L(MSG[s.msg]))}</div>`;
    const link = s.txid ? ` <a href="${EXPLORER}/transactions/${s.txid}" target="_blank" rel="noopener">${t("explorerLink")}</a>` : "";
    const lbl = { vault: t("vault"), owner: t("ownerW"), recovery: t("recoveryW") };
    $("inspector").innerHTML = `${head}
      <dl class="kv">
        <dt>${t("action")}</dt><dd><code>${s.action}</code> · ${hhmm(s.at)} · ${t("signedBy")} ${s.signer === "recovery" || (s.attack !== "wrongkey" && s.action.startsWith("recover")) ? t("recovery") : t("owner")}</dd>
        ${s.txid ? `<dt>txid</dt><dd class="mono">${s.txid}${link}</dd>` : ""}
        ${s.fee ? `<dt>${t("fee")}</dt><dd>${kas(s.fee)} tKAS</dd>` : ""}
        ${s.seq !== undefined ? `<dt>${t("seqLbl")}</dt><dd>${nf().format(s.seq)}</dd>` : ""}
        ${s.lockTime ? `<dt>${t("lock")}</dt><dd>${new Date(s.lockTime).toLocaleString(lang === "fr" ? "fr-FR" : "en-GB")}</dd>` : ""}
      </dl>
      ${s.note ? `<p class="hint">${esc(L(s.note))}</p>` : ""}
      ${s.outputs ? `<table><thead><tr><th>${t("output")}</th><th>tKAS</th><th>${t("to")}</th></tr></thead><tbody>
        ${s.input ? `<tr><td>${t("input")}</td><td>${kas(s.input)}</td><td><span class="tag">${t("vault")}</span></td></tr>` : ""}
        ${s.outputs.map(([a, to], n) => `<tr><td>#${n}</td><td>${kas(a)}</td><td><span class="tag ${to === "vault" ? "" : "grey"}">${lbl[to]}</span></td></tr>`).join("")}
      </tbody></table>` : ""}
      ${s.detail ? `<details><summary>${t("detail")}</summary><pre>${esc(s.detail)}</pre></details>` : ""}
      ${s.txid ? `<p class="hint" style="margin-top:8px">${t("indexer")}</p>` : ""}`;
  }

  function renderSteps() {
    $("steps").innerHTML = SESSION.map((s, i) => `<li data-step="${i}" class="${i === stepIdx ? "cur" : ""}">
      <span class="mk ${s.ok ? "ok" : "bad"}">${s.ok ? "✓" : "✗"}</span><span class="when">${hhmm(s.at)}</span><span class="mono">${s.action}${s.attack ? " ⚔" : ""}</span></li>`).join("");
    $("stepCount").textContent = stepIdx >= 0 ? `${stepIdx + 1} / ${SESSION.length}` : `${SESSION.length}`;
    const cur = $("steps").querySelector(".cur"); if (cur) cur.scrollIntoView({ block: "nearest" });
  }
  function go(i) { stepIdx = Math.max(0, Math.min(SESSION.length - 1, i)); renderInspector(stepIdx); renderSteps(); }

  const ATTACKS = ["cap", "early", "wrongkey", "fee", "sweep"];
  function renderAttacks() {
    $("attacks").innerHTML = ATTACKS.map((a) => {
      const i = SESSION.findIndex((s) => s.attack === a), s = SESSION[i];
      return `<div class="attack"><div>${t("att." + a)}<small>${s.stage === "local" ? (lang === "fr" ? "refusée par le contrat" : "rejected by the contract") : (lang === "fr" ? "refusée par le réseau" : "rejected by the network")}</small></div>
        <span class="pill bad" style="margin:0">✗</span><button class="btn small" type="button" data-step="${i}">${t("show")}</button></div>`;
    }).join("");
  }

  function play() {
    if (timer) { clearInterval(timer); timer = null; $("playBtn").textContent = t("replay.play"); return; }
    if (stepIdx >= SESSION.length - 1) stepIdx = -1;
    $("playBtn").textContent = t("replay.pause");
    go(stepIdx + 1);
    timer = setInterval(() => {
      if (stepIdx >= SESSION.length - 1) { clearInterval(timer); timer = null; $("playBtn").textContent = t("replay.play"); return; }
      go(stepIdx + 1);
    }, 2600);
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = lang === "en" ? "Kaspa vault console | Martino Ismaël" : "Console du coffre Kaspa | Martino Ismaël";
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.innerHTML = t(el.dataset.i18n); });
    document.querySelectorAll(".lang-switch [data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    if (timer) $("playBtn").textContent = t("replay.pause");
    $("vaultSel").innerHTML = `<option value="main">${t("vault.main")}</option><option value="demo">${t("vault.demo")}</option>`;
    $("vaultSel").value = vaultId;
    renderPaths(); renderStatus(); renderAttacks(); renderSteps(); renderInspector(stepIdx);
  }

  async function getJSON(path) { const r = await fetch(API + path); if (!r.ok) throw new Error(r.status); return r.json(); }
  async function refresh() {
    const v = VAULTS[vaultId];
    try {
      const [dag, vu, ou] = await Promise.all([getJSON("/info/blockdag"), getJSON(`/addresses/${v.address}/utxos`), getJSON(`/addresses/${OWNER}/utxos`)]);
      const daa = Number(dag.virtualDaaScore);
      const utxos = vu.map((u) => ({ txid: u.outpoint.transactionId, index: u.outpoint.index, amount: Number(u.utxoEntry.amount), age: daa - Number(u.utxoEntry.blockDaaScore) }))
        .sort((a, b) => b.amount - a.amount);
      st = { daa, utxos, balance: utxos.reduce((s, u) => s + u.amount, 0), owner: ou.reduce((s, u) => s + Number(u.utxoEntry.amount), 0) };
      fetchedAt = Date.now();
      renderStatus();
    } catch {
      $("pathsHint").textContent = t("api");
    }
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-step]"); if (b) { if (timer) play(); go(Number(b.dataset.step)); }
  });
  $("playBtn").addEventListener("click", play);
  $("prevBtn").addEventListener("click", () => { if (timer) play(); go(stepIdx - 1); });
  $("nextBtn").addEventListener("click", () => { if (timer) play(); go(stepIdx + 1); });
  $("vaultSel").addEventListener("change", (e) => { vaultId = e.target.value; st = null; renderPaths(); renderStatus(); refresh(); });
  document.querySelectorAll(".lang-switch [data-lang]").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.lang; store.set("site.lang", lang); applyLang(); }));

  applyLang();
  refresh();
  setInterval(refresh, REFRESH_MS);
  setInterval(tick, 1000);
})();
</script>
</body>
